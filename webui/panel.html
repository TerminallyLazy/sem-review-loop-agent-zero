<html>
<head>
  <script type="module">
    import { store } from "/plugins/sem_review_loop/webui/sem-review-store.js";
  </script>
  <style>
    .sem-review-host, .sem-review-panel, .sem-review-ledger { min-width: 0; min-height: 0; }
    .sem-review-host { display: contents; }
    .sem-review-panel {
      box-sizing: border-box; display: flex; width: 100%; height: 100%; overflow: hidden;
      color: var(--color-text, #d9dde3); background: var(--color-background, #17191d);
      font-family: var(--font-family-main, sans-serif);
    }
    .sem-review-ledger { display: flex; flex-direction: column; width: 100%; border: 1px solid var(--color-border, #343941); }
    .sem-review-header { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .85rem 1rem; border-bottom: 1px solid var(--color-border, #343941); }
    .sem-review-heading { min-width: 0; }
    .sem-review-kicker, .sem-review-label { color: var(--color-text-secondary, #939aa5); font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .sem-review-heading strong { display: block; margin-top: .15rem; font-size: 1rem; }
    .sem-review-heading small { display: block; margin-top: .2rem; color: var(--color-text-secondary, #939aa5); overflow-wrap: anywhere; }
    .sem-review-actions, .sem-review-tabs, .sem-review-toolbar, .sem-review-inline-actions { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
    .sem-review-actions { justify-content: flex-end; }
    .sem-review-pill, .sem-review-badge { display: inline-flex; align-items: center; gap: .3rem; padding: .28rem .52rem; border: 1px solid var(--color-border, #343941); border-radius: 999px; color: var(--color-text-secondary, #939aa5); background: var(--color-background-secondary, #20242a); font-size: .7rem; }
    .sem-review-pill.is-on, .sem-review-badge.is-structural { color: var(--color-warning, #d4a85b); border-color: color-mix(in srgb, var(--color-warning, #d4a85b) 55%, var(--color-border, #343941)); }
    .sem-review-tabs { padding: .55rem .75rem 0; border-bottom: 1px solid var(--color-border, #343941); }
    .sem-review-tab { border: 0; border-bottom: 2px solid transparent; padding: .55rem .65rem; color: var(--color-text-secondary, #939aa5); background: transparent; cursor: pointer; }
    .sem-review-tab.is-active { border-bottom-color: var(--color-accent, #83a5d6); color: var(--color-text, #d9dde3); }
    .sem-review-body { min-height: 0; overflow: auto; padding: .8rem; }
    .sem-review-toolbar { justify-content: space-between; margin-bottom: .75rem; }
    .sem-review-toolbar select, .sem-review-toolbar input, .sem-review-field input, .sem-review-field select { min-height: 2rem; border: 1px solid var(--color-border, #343941); border-radius: .35rem; color: inherit; background: var(--color-background-secondary, #20242a); padding: .35rem .5rem; }
    .sem-review-button { min-height: 2rem; border: 1px solid var(--color-border, #343941); border-radius: .35rem; color: inherit; background: var(--color-background-secondary, #20242a); padding: .35rem .6rem; cursor: pointer; }
    .sem-review-button:hover { border-color: var(--color-accent, #83a5d6); }
    .sem-review-button:disabled { cursor: wait; opacity: .55; }
    .sem-review-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .45rem; margin-bottom: .75rem; }
    .sem-review-metric, .sem-review-card { min-width: 0; border: 1px solid var(--color-border, #343941); background: var(--color-background-secondary, #20242a); }
    .sem-review-metric { padding: .65rem; }
    .sem-review-metric strong { display: block; margin-top: .15rem; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .sem-review-empty, .sem-review-note { padding: 1rem; border: 1px dashed var(--color-border, #343941); color: var(--color-text-secondary, #939aa5); }
    .sem-review-groups { display: grid; gap: .6rem; }
    .sem-review-group-title { padding: .45rem .55rem; color: var(--color-text-secondary, #939aa5); background: var(--color-background-secondary, #20242a); font-size: .75rem; overflow-wrap: anywhere; }
    .sem-review-change { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .6rem; width: 100%; border: 0; border-bottom: 1px solid var(--color-border, #343941); padding: .65rem .55rem; color: inherit; background: var(--color-background, #17191d); text-align: left; cursor: pointer; }
    .sem-review-change:hover, .sem-review-change.is-selected { background: color-mix(in srgb, var(--color-accent, #83a5d6) 12%, var(--color-background, #17191d)); }
    .sem-review-change-name, .sem-review-card-title { font-weight: 650; overflow-wrap: anywhere; }
    .sem-review-change-meta, .sem-review-card-meta { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; margin-top: .25rem; color: var(--color-text-secondary, #939aa5); font-size: .73rem; }
    .sem-review-detail { display: grid; gap: .65rem; margin-top: .85rem; }
    .sem-review-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem; }
    .sem-review-detail-pane { min-width: 0; border: 1px solid var(--color-border, #343941); background: #101216; }
    .sem-review-detail-pane header { padding: .4rem .55rem; color: var(--color-text-secondary, #939aa5); font-size: .7rem; text-transform: uppercase; }
    .sem-review-detail-pane pre { max-height: 18rem; margin: 0; overflow: auto; padding: .65rem; color: #cbd2dc; font: .72rem/1.45 var(--font-family-mono, monospace); white-space: pre-wrap; overflow-wrap: anywhere; }
    .sem-review-diff { min-width: 0; max-width: 100%; overflow: hidden; border: 1px solid var(--color-border, #343941); background: #101216; }
    .sem-review-diff-title { padding: .45rem .6rem; color: var(--color-text-secondary, #939aa5); font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .sem-review-diff-lines { max-height: 24rem; overflow: auto; padding: .35rem 0; font: .72rem/1.5 var(--font-family-mono, monospace); }
    .sem-review-diff-line { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr); min-width: 0; padding: 0 .6rem; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
    .sem-review-diff-line > code { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
    .sem-review-diff-line.is-removed { color: #ffd2d2; background: color-mix(in srgb, #d66a6a 18%, #101216); }
    .sem-review-diff-line.is-added { color: #c9f4d0; background: color-mix(in srgb, #5fae73 18%, #101216); }
    .sem-review-diff-line.is-same { color: #cbd2dc; }
    .sem-review-diff-marker { color: currentColor; font-weight: 800; user-select: none; }
    .sem-review-card { padding: .7rem; }
    .sem-review-card + .sem-review-card { margin-top: .55rem; }
    .sem-review-card p { margin: .4rem 0 0; color: var(--color-text-secondary, #939aa5); overflow-wrap: anywhere; }
    .sem-review-card pre { max-width: 100%; max-height: 18rem; box-sizing: border-box; margin: .6rem 0 0; overflow: auto; padding: .6rem; color: #cbd2dc; background: #101216; font: .72rem/1.45 var(--font-family-mono, monospace); white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
    .sem-review-card-actions { display: flex; justify-content: flex-end; gap: .45rem; margin-top: .65rem; }
    .sem-review-error { margin-bottom: .7rem; padding: .55rem .7rem; border-left: 3px solid var(--color-error, #c96c6c); color: var(--color-error, #c96c6c); background: color-mix(in srgb, var(--color-error, #c96c6c) 10%, transparent); overflow-wrap: anywhere; }
    .sem-review-loading { display: inline-flex; align-items: center; gap: .4rem; color: var(--color-text-secondary, #939aa5); font-size: .78rem; }
    .sem-review-loading .material-symbols-outlined { animation: sem-review-spin 1s linear infinite; }
    .sem-review-field { display: grid; gap: .35rem; margin-bottom: .8rem; }
    .sem-review-field small { color: var(--color-text-secondary, #939aa5); overflow-wrap: anywhere; }
    .sem-review-switch { display: flex; align-items: center; gap: .5rem; }
    @keyframes sem-review-spin { to { transform: rotate(360deg); } }
    @media (max-width: 680px) { .sem-review-summary, .sem-review-detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .sem-review-header { align-items: flex-start; } }
    @media (max-width: 420px) { .sem-review-summary { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="sem-review-host" x-data>
    <template x-if="$store.semReviewLoop">
      <div class="sem-review-panel" x-create="$store.semReviewLoop.onMount($el, xAttrs($el) || {})" x-destroy="$store.semReviewLoop.cleanup()">
        <section class="sem-review-ledger" aria-label="Semantic Review">
          <header class="sem-review-header">
            <div class="sem-review-heading">
              <span class="sem-review-kicker">Local semantic ledger</span>
              <strong>Semantic Review</strong>
              <small x-text="$store.semReviewLoop.watchedLabel()"></small>
            </div>
            <div class="sem-review-actions">
              <span class="sem-review-pill" :class="{ 'is-on': $store.semReviewLoop.payload?.review?.mcp_enabled }">
                <span class="material-symbols-outlined" aria-hidden="true">lock</span>
                <span x-text="$store.semReviewLoop.payload?.review?.mcp_enabled ? 'MCP armed' : 'MCP off'"></span>
              </span>
              <button type="button" class="sem-review-button" @click="$store.semReviewLoop.refreshStatus()" :disabled="$store.semReviewLoop.loading">Refresh</button>
            </div>
          </header>

          <nav class="sem-review-tabs" aria-label="Semantic Review views">
            <button type="button" class="sem-review-tab" :class="{ 'is-active': $store.semReviewLoop.activeTab === 'changes' }" @click="$store.semReviewLoop.activeTab = 'changes'">Changes</button>
            <button type="button" class="sem-review-tab" :class="{ 'is-active': $store.semReviewLoop.activeTab === 'review' }" @click="$store.semReviewLoop.activeTab = 'review'">Review</button>
            <button type="button" class="sem-review-tab" :class="{ 'is-active': $store.semReviewLoop.activeTab === 'lessons' }" @click="$store.semReviewLoop.activeTab = 'lessons'">Lessons (<span x-text="$store.semReviewLoop.pendingLessons().length"></span>)</button>
          </nav>

          <main class="sem-review-body">
            <div class="sem-review-loading" x-show="$store.semReviewLoop.loading"><span class="material-symbols-outlined">progress_activity</span><span>Refreshing semantic state</span></div>

            <section x-show="$store.semReviewLoop.activeTab === 'changes'">
              <div class="sem-review-toolbar">
                <label><span class="sem-review-label">View </span><select x-model="$store.semReviewLoop.diffMode" @change="$store.semReviewLoop.refreshDiff()"><option value="working">Working tree</option><option value="staged">Staged</option><option value="commit">Commit</option><option value="range">Range</option></select></label>
                <div class="sem-review-inline-actions"><button type="button" class="sem-review-button" @click="$store.semReviewLoop.refreshDiff()" :disabled="$store.semReviewLoop.busy">Run diff</button></div>
              </div>
              <div class="sem-review-summary">
                <div class="sem-review-metric"><span class="sem-review-label">Entities</span><strong x-text="$store.semReviewLoop.summary().total"></strong></div>
                <div class="sem-review-metric"><span class="sem-review-label">Structural</span><strong x-text="$store.semReviewLoop.summary().structural"></strong></div>
                <div class="sem-review-metric"><span class="sem-review-label">Added / changed</span><strong x-text="`${$store.semReviewLoop.summary().added} / ${$store.semReviewLoop.summary().modified}`"></strong></div>
                <div class="sem-review-metric"><span class="sem-review-label">Revision</span><strong x-text="$store.semReviewLoop.payload?.review?.revision ?? '—'"></strong></div>
              </div>
              <template x-if="$store.semReviewLoop.groupedChanges().length === 0"><div class="sem-review-empty">No semantic entities in this view.</div></template>
              <div class="sem-review-groups">
                <template x-for="group in $store.semReviewLoop.groupedChanges()" :key="group.path">
                  <div>
                    <div class="sem-review-group-title" x-text="group.path"></div>
                    <template x-for="change in group.changes" :key="change.entity_id">
                      <button type="button" class="sem-review-change" :class="{ 'is-selected': $store.semReviewLoop.selectedEntityId === change.entity_id }" @click="$store.semReviewLoop.selectEntity(change.entity_id); $store.semReviewLoop.activeTab = 'review'">
                        <span><span class="sem-review-change-name" x-text="change.entity_name || change.entity_id"></span><span class="sem-review-change-meta"><span x-text="change.change_type"></span><span x-text="`${change.start_line ?? '—'}–${change.end_line ?? '—'}`"></span></span></span>
                        <span class="sem-review-badge" :class="{ 'is-structural': change.structural }" x-text="change.structural ? 'structural' : 'cosmetic'"></span>
                      </button>
                    </template>
                  </div>
                </template>
              </div>
            </section>

            <section x-show="$store.semReviewLoop.activeTab === 'review'">
              <template x-if="$store.semReviewLoop.selectedChange()">
                <div class="sem-review-detail">
                  <div class="sem-review-card"><div class="sem-review-card-title" x-text="$store.semReviewLoop.selectedChange()?.entity_name"></div><div class="sem-review-card-meta"><span x-text="$store.semReviewLoop.selectedChange()?.file_path"></span><span x-text="$store.semReviewLoop.selectedChange()?.change_type"></span><span x-text="$store.semReviewLoop.snapshot()?.fingerprint"></span></div><div class="sem-review-inline-actions"><button type="button" class="sem-review-button" @click="$store.semReviewLoop.loadDetail()">Load detail</button><button type="button" class="sem-review-button" @click="$store.semReviewLoop.loadContext()">Context</button><button type="button" class="sem-review-button" @click="$store.semReviewLoop.loadImpact()">Impact</button></div></div>
                  <template x-if="$store.semReviewLoop.detail"><div class="sem-review-diff" aria-label="Semantic diff"><div class="sem-review-diff-title">Semantic diff</div><div class="sem-review-diff-lines"><template x-for="(line, index) in $store.semReviewLoop.detailDiffLines()" :key="`${index}-${line.kind}`"><div class="sem-review-diff-line" :class="`is-${line.kind}`"><span class="sem-review-diff-marker" aria-hidden="true" x-text="line.kind === 'removed' ? '−' : line.kind === 'added' ? '+' : ' ' "></span><code x-text="line.text"></code></div></template></div></div></template>
                  <template x-if="$store.semReviewLoop.contextResult"><div class="sem-review-card"><div class="sem-review-card-title">Entity context</div><pre x-text="$store.semReviewLoop.formatResult($store.semReviewLoop.contextResult)"></pre></div></template>
                  <template x-if="$store.semReviewLoop.impactResult"><div class="sem-review-card"><div class="sem-review-card-title">Impact</div><pre x-text="$store.semReviewLoop.formatResult($store.semReviewLoop.impactResult)"></pre></div></template>
                </div>
              </template>
              <template x-if="!$store.semReviewLoop.selectedChange()"><div class="sem-review-empty">Select an entity from Changes to inspect its review card.</div></template>
              <div class="sem-review-card" style="margin-top:.8rem"><div class="sem-review-card-title">Completion checkpoint</div><p x-text="$store.semReviewLoop.payload?.review?.checkpoint?.outcome || 'No checkpoint recorded for this fingerprint.'"></p><div class="sem-review-card-actions"><button type="button" class="sem-review-button" @click="$store.semReviewLoop.cancelReview()" :disabled="!$store.semReviewLoop.payload?.review?.checkpoint">Cancel current review</button></div></div>
              <div class="sem-review-card" style="margin-top:.8rem"><div class="sem-review-card-title">Project MCP</div><p>Enable only the focused local sem tools for this project. The preview shows the exact managed entry before writing.</p><div class="sem-review-card-actions"><button type="button" class="sem-review-button" @click="$store.semReviewLoop.previewMcp()" :disabled="$store.semReviewLoop.busy">Preview</button><button type="button" class="sem-review-button" x-show="$store.semReviewLoop.mcpPreview" @click="$store.semReviewLoop.mcpConfirmed = !$store.semReviewLoop.mcpConfirmed" x-text="$store.semReviewLoop.mcpConfirmed ? 'Confirmed' : 'Confirm preview'"></button><button type="button" class="sem-review-button" x-show="$store.semReviewLoop.mcpPreview" @click="$store.semReviewLoop.enableMcp()" :disabled="!$store.semReviewLoop.mcpConfirmed">Enable MCP</button><button type="button" class="sem-review-button" x-show="$store.semReviewLoop.payload?.review?.mcp_enabled" @click="$store.semReviewLoop.disableMcp()">Disable</button></div><template x-if="$store.semReviewLoop.mcpPreview"><pre x-text="$store.semReviewLoop.formatResult($store.semReviewLoop.mcpPreview.entry)"></pre></template></div>
            </section>

            <section x-show="$store.semReviewLoop.activeTab === 'lessons'">
              <template x-if="$store.semReviewLoop.pendingLessons().length === 0"><div class="sem-review-empty">No pending project lesson proposals.</div></template>
              <template x-for="lesson in $store.semReviewLoop.pendingLessons()" :key="lesson.proposal_id"><article class="sem-review-card"><div class="sem-review-card-title">Pending project lesson</div><div class="sem-review-card-meta"><span x-text="lesson.proposal_id"></span><span x-text="lesson.stale ? 'stale' : 'current'"></span></div><p x-text="lesson.problem"></p><p x-text="lesson.resolution"></p><div class="sem-review-card-actions"><button type="button" class="sem-review-button" @click="$store.semReviewLoop.approveLesson(lesson.proposal_id)" :disabled="lesson.stale">Approve</button><button type="button" class="sem-review-button" @click="$store.semReviewLoop.discardLesson(lesson.proposal_id)">Discard</button></div></article></template>
              <div class="sem-review-card" style="margin-top:.8rem"><div class="sem-review-card-title">Approved lessons</div><template x-if="$store.semReviewLoop.approvedLessons().length === 0"><p>No approved lessons for this project.</p></template><template x-for="lesson in $store.semReviewLoop.approvedLessons()" :key="lesson.proposal_id"><div class="sem-review-card-meta"><span x-text="lesson.problem"></span><button type="button" class="sem-review-button" @click="$store.semReviewLoop.deleteLesson(lesson.proposal_id)">Delete</button></div></template><div class="sem-review-card-actions"><button type="button" class="sem-review-button" x-show="$store.semReviewLoop.approvedLessons().length" @click="$store.semReviewLoop.forgetAllLessons()">Forget all</button></div></div>
            </section>
          </main>
        </section>
      </div>
    </template>
  </div>
</body>
</html>
